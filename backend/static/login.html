<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>RAG Chatbot</h1>
        <p class="subtitle">Connect your LLM provider to get started</p>

        <div class="form-group">
            <label for="provider">Provider</label>
            <select id="provider">
                <option value="groq">Groq</option>
                <option value="opencode_zen">OpenCode Zen</option>
            </select>
        </div>

        <div class="form-group">
            <label for="api-key">API Key</label>
            <input type="password" id="api-key" placeholder="Paste your API key">
        </div>

        <button id="connect-btn" class="btn btn-primary">Connect</button>

        <div id="model-section" class="hidden">
            <div class="form-group">
                <label for="model-select">Model</label>
                <select id="model-select"></select>
            </div>
            <button id="start-btn" class="btn btn-primary">Start Chatting</button>
        </div>

        <div id="error" class="error"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
