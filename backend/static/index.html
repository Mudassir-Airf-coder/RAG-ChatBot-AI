<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn btn-primary">+ New Chat</button>
                <button id="toggle-sidebar" class="icon-btn">☰</button>
            </div>
            <div id="documents-section">
                <h3>Documents</h3>
                <input type="file" id="file-input" style="display:none" multiple>
                <button id="upload-btn" class="btn btn-primary" style="width:100%;margin-bottom:12px">Upload Document</button>
                <div id="document-list"></div>
            </div>
            <div id="history-section">
                <h3>Chats</h3>
                <div id="chat-history"></div>
            </div>
        </div>

        <div id="chat-area">
            <div id="chat-messages">
                <div class="empty-state">
                    <h2>RAG Chatbot</h2>
                    <p>Ask questions about your documents</p>
                </div>
            </div>
            <div id="input-area">
                <textarea id="message-input" placeholder="Type your question..." rows="1"></textarea>
                <button id="send-btn" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>

    <div id="source-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Source Chunk</h3>
                <button id="close-modal" class="icon-btn">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
