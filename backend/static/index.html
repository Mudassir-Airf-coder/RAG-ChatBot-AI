<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chatbot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a25;--border:#2a2a3a;--text:#e0e0e8;--text2:#8888a0;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00b894;--red:#e74c3c;--orange:#fdcb6e;--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

.layout{display:grid;grid-template-columns:280px 1fr 320px;height:100vh;transition:grid-template-columns .25s ease}
.layout.panels-collapsed-left{grid-template-columns:0 1fr 320px}
.layout.panels-collapsed-right{grid-template-columns:280px 1fr 0}
.layout.panels-collapsed-both{grid-template-columns:0 1fr 0}

.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;overflow:hidden;transition:opacity .25s ease,transform .25s ease}
.layout.panels-collapsed-left .sidebar{opacity:0;pointer-events:none;transform:translateX(-100%);width:0;padding:0;border:0}
.config-panel{background:var(--surface);border-left:1px solid var(--border);padding:16px;overflow-y:auto;overflow:hidden;transition:opacity .25s ease,transform .25s ease}
.layout.panels-collapsed-right .config-panel{opacity:0;pointer-events:none;transform:translateX(100%);width:0;padding:0;border:0}

.sidebar h2{font-size:18px;margin-bottom:16px;color:var(--accent2)}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none}
.header-title{font-size:15px;color:var(--accent2)}
.header-actions{display:flex;gap:6px}
.header-icon-btn{background:transparent;border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:var(--radius);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
.header-icon-btn:hover{background:var(--surface2);color:var(--accent)}
.header-icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin:16px 0 8px}
.file-input{display:none}
.upload-status{font-size:12px;color:var(--text2);padding:6px 0;text-align:center;min-height:18px}
.upload-status.error{color:var(--red)}
.upload-status.success{color:var(--green)}
.upload-status .spinner{display:inline-block;margin-right:6px;vertical-align:middle}
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);margin-bottom:4px;font-size:13px;background:var(--surface2)}
.doc-item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-status{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.status-ready{background:#00b89422;color:var(--green)}
.status-processing{background:#fdcb6e22;color:var(--orange)}
.status-failed{background:#e74c3c22;color:var(--red)}
.doc-del{background:transparent;border:none;color:var(--text2);cursor:pointer;padding:4px 6px;border-radius:4px;display:grid;place-items:center;transition:background .15s,color .15s;font-size:11px;font-weight:600}
.doc-del:hover{background:rgba(231,76,60,.15);color:var(--red)}
.doc-del.confirming{background:var(--red);color:#fff;padding:4px 8px}

.chat-main{display:flex;flex-direction:column;background:var(--bg)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2)}
.empty-state h2{font-size:24px;margin-bottom:8px;color:var(--accent2)}
.message{max-width:80%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.user-message{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.assistant-message{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:2px;max-width:min(78%,720px)}
.assistant-message.abstained{border:1px solid var(--orange);color:var(--orange)}
.citations{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.citation{background:rgba(108,92,231,.15);color:var(--accent2);border:1px solid rgba(108,92,231,.3);padding:3px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600;transition:background .15s}
.citation:hover{background:rgba(108,92,231,.3)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--text2);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.rewrite-hint{align-self:flex-start;font-size:11px;color:var(--text2);font-style:italic;padding:4px 8px;margin-top:-8px}

.input-area{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
.input-area textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-size:14px;resize:none;max-height:120px;font-family:inherit}
.input-area textarea:focus{outline:none;border-color:var(--accent)}

.config-panel h3{font-size:15px;margin-bottom:16px;color:var(--accent2);display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.badge-ready{background:#00b89422;color:var(--green)}
.badge-uploaded{background:#8888a022;color:var(--text2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:13px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.config-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.status-msg{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:var(--radius)}
.status-ok{background:#00b89422;color:var(--green)}
.status-err{background:#e74c3c22;color:var(--red)}

.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:1000;animation:fadeIn .3s}
.toast-success{background:var(--green);color:#000}
.toast-error{background:var(--red);color:#fff}
.toast-info{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
.modal.hidden{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal-content{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h3{font-size:16px}
pre{background:var(--surface2);padding:12px;border-radius:var(--radius);font-size:13px;white-space:pre-wrap;overflow-x:auto}

.provider-section{border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:16px;background:var(--surface2)}
.provider-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.provider-section-title{font-size:13px;font-weight:600;color:var(--accent2)}
.provider-section-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.divider{height:1px;background:var(--border);margin:16px 0}
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="sidebar">
    <div class="section-title">Documents</div>
    <input type="file" id="file-input" accept=".pdf,.txt,.md,.docx" hidden>
    <label for="file-input" class="btn" style="width:100%;margin-bottom:12px;display:block;text-align:center;cursor:pointer">Upload Document</label>
    <div id="upload-status" class="upload-status"></div>
    <div id="document-list"></div>
  </div>

  <div class="chat-main">
    <div class="header">
      <div class="header-brand">
        <img src="/logo.jpeg" alt="RAG Chatbot" class="brand-logo">
        <span class="header-title">RAG Chatbot</span>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" id="toggle-left" aria-label="Toggle documents panel" title="Documents">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </button>
        <button class="header-icon-btn" id="toggle-right" aria-label="Toggle provider panel" title="Provider">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="empty-state"><h2>RAG Chatbot</h2><p>Ask questions about your uploaded documents</p></div>
    </div>
    <div class="input-area">
      <textarea id="message-input" placeholder="Type your question..." rows="1"></textarea>
      <button class="btn" id="send-btn">Send</button>
    </div>
  </div>

  <div class="config-panel">
    <!-- LLM Provider Section -->
    <div class="provider-section" id="llm-section">
      <div class="provider-section-header">
        <span class="provider-section-title">LLM Provider</span>
        <span class="provider-section-badge badge-uploaded" id="llm-badge">Not saved</span>
      </div>
      <div class="field">
        <label>Provider</label>
        <select id="cfg-provider">
          <option value="groq">Groq</option>
          <option value="opencode">OpenCode Zen</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field">
        <label>Provider Name</label>
        <input id="cfg-name" value="Groq" placeholder="Groq">
      </div>
      <div class="field">
        <label>Base URL</label>
        <input id="cfg-url" value="https://api.groq.com/openai/v1" placeholder="https://api.groq.com/openai/v1">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="cfg-key" type="password" placeholder="gsk_...">
      </div>
      <div class="field">
        <label>Model</label>
        <select id="cfg-model"><option value="">Fetch models first</option></select>
      </div>
      <div class="config-actions">
        <button class="btn btn-sm" id="fetch-models-btn">Fetch Models</button>
        <button class="btn btn-sm btn-outline" id="test-btn">Test</button>
        <button class="btn btn-sm" id="save-llm-btn">Save</button>
      </div>
      <div id="llm-config-status"></div>
    </div>

    <div class="divider"></div>

    <!-- Embedding Provider Section (Cohere) -->
    <div class="provider-section" id="embedding-section">
      <div class="provider-section-header">
        <span class="provider-section-title">Embedding Provider (Cohere)</span>
        <span class="provider-section-badge badge-uploaded" id="embedding-badge">Not saved</span>
      </div>
      <div class="field">
        <label>Cohere API Key</label>
        <input id="cfg-cohere-key" type="password" placeholder="sk-...">
      </div>
      <div class="config-actions">
        <button class="btn btn-sm btn-outline" id="test-cohere-btn">Test Connection</button>
        <button class="btn btn-sm" id="save-embedding-btn">Save</button>
      </div>
      <div id="embedding-config-status"></div>
    </div>
  </div>
</div>

<div class="modal hidden" id="source-modal">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header"><h3>Source Chunk</h3><button class="btn btn-sm btn-outline" id="close-modal">&#x2715;</button></div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script>
console.log('[rag] UI loaded');
const API = '/api/v1';
const layout = document.getElementById('layout');
const chatMessages = document.getElementById('chat-messages');
const messageInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const cfgName = document.getElementById('cfg-name');
const cfgUrl = document.getElementById('cfg-url');
const cfgKey = document.getElementById('cfg-key');
const cfgModel = document.getElementById('cfg-model');
const providerSelect = document.getElementById('cfg-provider');
const llmConfigStatus = document.getElementById('llm-config-status');
const embeddingConfigStatus = document.getElementById('embedding-config-status');
const cfgCohereKey = document.getElementById('cfg-cohere-key');

// === Panel toggles ===
function updateCollapseState() {
  const left = layout.classList.contains('panels-collapsed-left');
  const right = layout.classList.contains('panels-collapsed-right');
  if (left && right) layout.classList.add('panels-collapsed-both');
  else layout.classList.remove('panels-collapsed-both');
  document.getElementById('toggle-left').classList.toggle('active', left);
  document.getElementById('toggle-right').classList.toggle('active', right);
  sessionStorage.setItem('ui.leftCollapsed', left);
  sessionStorage.setItem('ui.rightCollapsed', right);
}

document.getElementById('toggle-left').addEventListener('click', () => {
  layout.classList.toggle('panels-collapsed-left');
  layout.classList.remove('panels-collapsed-both');
  updateCollapseState();
});

document.getElementById('toggle-right').addEventListener('click', () => {
  layout.classList.toggle('panels-collapsed-right');
  layout.classList.remove('panels-collapsed-both');
  updateCollapseState();
});

(function restorePanels() {
  if (sessionStorage.getItem('ui.leftCollapsed') === 'true') layout.classList.add('panels-collapsed-left');
  if (sessionStorage.getItem('ui.rightCollapsed') === 'true') layout.classList.add('panels-collapsed-right');
  updateCollapseState();
})();

// === Toast ===
function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function escapeAttr(text) {
  return text.replace(/"/g, '"').replace(/'/g, ''');
}

function extractError(obj, fallback) {
  if (!obj) return fallback;
  if (obj.error && typeof obj.error.message === 'string') return obj.error.message;
  if (typeof obj.detail === 'string') return obj.detail;
  if (typeof obj.message === 'string') return obj.message;
  return fallback;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

// === Chat ===
function renderLoading() {
  const d = document.createElement('div');
  d.className = 'message assistant-message loading-msg';
  d.id = 'loading-indicator';
  d.innerHTML = '<span class="spinner"></span> Thinking...';
  chatMessages.appendChild(d);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

function renderUserMessage(text) {
  const d = document.createElement('div');
  d.className = 'message user-message';
  d.innerHTML = '<div class="message-content">' + escapeHtml(text) + '</div>';
  chatMessages.appendChild(d);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderAssistantMessage(answer, citations, abstained) {
  const d = document.createElement('div');
  d.className = 'message assistant-message' + (abstained ? ' abstained' : '');
  d.style.width = 'fit-content';
  d.style.maxWidth = '85%';

  let citationsHtml = '';
  if (citations && citations.length > 0) {
    citationsHtml = '<div class="citations">' +
      citations.map((c, i) =>
        '<span class="citation" data-idx="' + i + '" title="' +
        escapeAttr(c.document_name || '') + '">[' + (i + 1) + ']</span>'
      ).join('') +
      '</div>';
  }

  d.innerHTML =
    '<div class="message-content">' + escapeHtml(answer) + '</div>' +
    citationsHtml;

  chatMessages.appendChild(d);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  d.querySelectorAll('.citation').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const c = citations[idx];
      if (c) {
        document.getElementById('modal-body').textContent =
          (c.quote || 'No text available') +
          (c.document_name ? '\n\n— ' + c.document_name : '');
        document.getElementById('source-modal').classList.remove('hidden');
      }
    });
  });
}

document.getElementById('close-modal').addEventListener('click', () => document.getElementById('source-modal').classList.add('hidden'));
document.getElementById('modal-backdrop').addEventListener('click', () => document.getElementById('source-modal').classList.add('hidden'));

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;

  const saved = sessionStorage.getItem('rag_config');
  if (!saved) {
    showToast('Configure a provider first. Opening panel.', 'info');
    layout.classList.remove('panels-collapsed-right');
    updateCollapseState();
    document.getElementById('cfg-key').focus();
    return;
  }

  messageInput.value = '';
  messageInput.style.height = 'auto';
  renderUserMessage(text);
  renderLoading();

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 60000);

  try {
    let res = await fetch(API + '/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: text }),
      credentials: 'same-origin',
      signal: controller.signal
    });

    // Auto-recover from stale session
    if (res.status === 400) {
      const errBody = await res.clone().json().catch(() => ({}));
      const msg = extractError(errBody, '');
      if (msg.toLowerCase().includes('no provider configured')) {
        try {
          await saveProviderConfig(false);
          res = await fetch(API + '/query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ question: text }),
            credentials: 'same-origin',
            signal: controller.signal
          });
        } catch (e) { /* fall through to error handling */ }
      }
    }

    clearTimeout(timeout);
    removeLoading();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(extractError(err, 'HTTP ' + res.status));
    }

    const data = await res.json();
    renderAssistantMessage(data.answer, data.citations || [], data.abstained);
    if (data.rewritten_query) {
      const hint = document.createElement('div');
      hint.className = 'rewrite-hint';
      hint.textContent = 'Rewritten: "' + data.rewritten_query + '"';
      chatMessages.appendChild(hint);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    loadDocuments();
  } catch (err) {
    clearTimeout(timeout);
    removeLoading();
    if (err.name === 'AbortError') {
      showToast('Request timed out. Try again.', 'error');
    } else {
      showToast(err.message, 'error');
      renderAssistantMessage('Error: ' + err.message, [], false);
    }
  }
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
messageInput.addEventListener('input', () => { messageInput.style.height = 'auto'; messageInput.style.height = messageInput.scrollHeight + 'px'; });

// === Provider presets ===
const PROVIDER_PRESETS = {
  groq: { name: 'Groq', base_url: 'https://api.groq.com/openai/v1' },
  opencode: { name: 'OpenCode Zen', base_url: 'https://opencode.ai/zen/v1' },
  custom: { name: '', base_url: '' }
};

providerSelect.addEventListener('change', () => {
  const preset = PROVIDER_PRESETS[providerSelect.value];
  if (preset) {
    cfgName.value = preset.name;
    cfgUrl.value = preset.base_url;
    cfgModel.innerHTML = '<option value="">Fetch models first</option>';
  }
});

function restoreProviderSelection() {
  const url = cfgUrl.value.toLowerCase();
  if (url.includes('groq.com')) providerSelect.value = 'groq';
  else if (url.includes('opencode.ai')) providerSelect.value = 'opencode';
  else if (url) providerSelect.value = 'custom';
}

// === Provider config ===
function updateProviderStatus(saved, isLLM) {
  const badgeId = isLLM ? 'llm-badge' : 'embedding-badge';
  const b = document.getElementById(badgeId);
  b.className = 'provider-section-badge ' + (saved ? 'badge-ready' : 'badge-uploaded');
  b.textContent = saved ? 'Saved' : 'Not saved';
}

async function saveLLMConfig(showToastOnSuccess) {
  const name = cfgName.value.trim();
  const url = cfgUrl.value.trim();
  const key = cfgKey.value.trim();
  const model = cfgModel.value;
  if (!name || !url || !key || !model) {
    throw new Error('Fill all LLM fields first');
  }
  const res = await fetch(API + '/provider/config', {
    method: 'POST',

// === Documents with delete button ===
async function loadDocuments() {
  try {
    const res = await fetch(API + '/documents');
    const data = await res.json();
    const list = document.getElementById('document-list');
    list.innerHTML = '';
    (data.documents || []).forEach(doc => {
      const item = document.createElement('div');
      item.className = 'doc-item';

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = doc.filename || 'Untitled';
      name.title = doc.filename || '';

      const status = document.createElement('span');
      status.className = 'doc-status status-' + (doc.status || 'uploaded').toLowerCase();
      status.textContent = doc.status || 'UPLOADED';

      const del = document.createElement('button');
      del.className = 'doc-del';
      del.title = 'Delete';
      del.setAttribute('aria-label', 'Delete ' + (doc.filename || 'document'));
      del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

      let confirming = false;
      let deleting = false;
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (deleting) return;
        if (!confirming) {
          confirming = true;
          del.classList.add('confirming');
          del.textContent = 'Sure?';
          setTimeout(() => {
            confirming = false;
            del.classList.remove('confirming');
            del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
          }, 3000);
          return;
        }
        deleting = true;
        try {
          const r = await fetch(API + '/documents/' + encodeURIComponent(doc.id), { method: 'DELETE' });
          if (!r.ok) throw new Error('Delete failed');
          showToast('Deleted: ' + (doc.filename || doc.id), 'success');
          loadDocuments();
        } catch (err) {
          showToast('Could not delete: ' + err.message, 'error');
        } finally {
          deleting = false;
        }
      });

      item.appendChild(name);
      item.appendChild(status);
      item.appendChild(del);
      list.appendChild(item);
    });
  } catch (err) {
    showToast('Could not load documents', 'error');
  }
}

// === Upload with progress (XHR) ===
function uploadWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append('file', file);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + '/documents/upload');

    xhr.upload.onprogress = (evt) => {
      if (evt.lengthComputable && onProgress) {
        onProgress(evt.loaded, evt.total);
      }
    };

    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(data);
      } else {
        const msg = (data && (data.detail || (data.error && data.error.message))) || ('HTTP ' + xhr.status);
        reject(new Error(msg));
      }
    };

    xhr.onerror = () => reject(new Error('Network error during upload'));
    xhr.ontimeout = () => reject(new Error('Upload timed out after 5 minutes'));
    xhr.timeout = 300000;  // 5 minutes

    xhr.send(formData);
  });
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;

  const statusEl = document.getElementById('upload-status');
  const fileInput = e.target;

  for (const file of files) {
    statusEl.className = 'upload-status';
    statusEl.innerHTML = '<span class="spinner"></span> Uploading ' + escapeHtml(file.name) + ' (' + formatBytes(file.size) + ')…';

    try {
      const data = await uploadWithProgress(file, (loaded, total) => {
        const pct = Math.round((loaded / total) * 100);
        if (loaded < total) {
          statusEl.innerHTML = '<span class="spinner"></span> Uploading ' + escapeHtml(file.name) + ' — ' + pct + '% (' + formatBytes(loaded) + ' / ' + formatBytes(total) + ')';
        } else {
          statusEl.innerHTML = '<span class="spinner"></span> Queued for processing. This may take 2-5 minutes…';
        }
      });

      const status = (data && data.status) || 'unknown';
      if (status.toUpperCase() === 'FAILED') {
        throw new Error((data && data.error_message) || 'Backend returned FAILED status');
      }

      if (status.toUpperCase() === 'UPLOADED') {
        // Poll until READY or FAILED, max 5 minutes (100 attempts × 3s)
        let attempts = 0;
        while (attempts < 100) {
          await new Promise(r => setTimeout(r, 3000));
          const r = await fetch(API + '/documents/' + encodeURIComponent(data.id));
          if (!r.ok) break;
          const doc = await r.json();
          if (doc.status === 'READY') {
            statusEl.className = 'upload-status success';
            statusEl.textContent = 'Indexed: ' + file.name + ' (' + (doc.chunk_count || '?') + ' chunks)';
            showToast('Indexed: ' + file.name, 'success');
            break;
          }
          if (doc.status === 'FAILED') {
            statusEl.className = 'upload-status error';
            statusEl.textContent = 'Failed: ' + file.name + ' — ' + (doc.error_message || 'processing error');
            showToast('Failed: ' + file.name + ' — ' + (doc.error_message || 'processing error'), 'error');
            break;
          }
          // Show progress with chunk count and ETA
          const totalChunks = doc.chunk_count || 0;
          if (totalChunks > 0 && doc.status === 'PROCESSING') {
            const elapsed = attempts * 3;
            const eta = Math.max(0, Math.round((totalChunks / Math.max(1, attempts)) * 3 - elapsed));
            statusEl.innerHTML = '<span class="spinner"></span> Processing ' + escapeHtml(file.name) +
              ' — ' + totalChunks + ' chunks, ~' + eta + 's remaining…';
          }
          attempts++;
        }
        if (attempts >= 100) {
          statusEl.className = 'upload-status error';
          statusEl.textContent = 'Timed out: ' + file.name + ' — check server log';
          showToast('Upload timed out: ' + file.name, 'error');
        }
      } else {
        statusEl.className = 'upload-status success';
        statusEl.textContent = 'Uploaded: ' + file.name + ' (' + status + ')';
        showToast('Uploaded: ' + file.name, 'success');
      }
    } catch (err) {
      console.error('[rag] upload error', err);
      statusEl.className = 'upload-status error';
      statusEl.textContent = 'Failed: ' + file.name + ' — ' + err.message;
      showToast('Upload failed: ' + err.message, 'error');
    }
  }

  fileInput.value = '';
  loadDocuments();
  setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'upload-status'; }, 5000);
});

loadDocuments();
